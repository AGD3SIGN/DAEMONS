# DAEMONS feedback relay. See README.md for the one-time setup (KV namespace, Turnstile site, secrets).
name = "daemons-feedback"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
GITHUB_REPO = "AGD3SIGN/daemons-feedback"
# Public site key from Cloudflare dashboard > Turnstile (widget "DAEMONS feedback").
TURNSTILE_SITE_KEY = "0x4AAAAAAGBZeNw0rv5Y6aS_"
# Browser origins allowed to send drafts (the web build and local testing). Native apps don't send an Origin.
ALLOWED_ORIGINS = "https://agd3sign.github.io,http://localhost:8060"

[[kv_namespaces]]
binding = "FEEDBACK_KV"
# Created with: npx wrangler kv namespace create FEEDBACK_KV (2026-11-14)
id = "3c48b84340bc4d6f8926d6f930b2ee15"

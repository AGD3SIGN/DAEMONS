# DAEMONS feedback relay. See README.md for the one-time setup (KV namespace, Turnstile site, secrets).
name = "daemons-feedback"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
GITHUB_REPO = "AGD3SIGN/daemons-feedback"
# Public site key from Cloudflare dashboard > Turnstile (replace after creating the widget).
TURNSTILE_SITE_KEY = "REPLACE_WITH_TURNSTILE_SITE_KEY"
# Browser origins allowed to send drafts (the web build and local testing). Native apps don't send an Origin.
ALLOWED_ORIGINS = "https://agd3sign.github.io,http://localhost:8060"

[[kv_namespaces]]
binding = "FEEDBACK_KV"
# Replace with the id printed by: npx wrangler kv namespace create FEEDBACK_KV
id = "REPLACE_WITH_KV_NAMESPACE_ID"
